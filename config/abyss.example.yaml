profile: embedded

hot:
  backend: builtin_hashmap
  max_memory_bytes: 4294967296
  default_eviction_seconds: 86400
  eviction_tick_ms: 1000
  # Shards; the queue and the cold consumers use the same count.
  shard_count: 64
  # Share of max_memory_bytes kept for evicted keys' stubs, about 80 B each.
  stub_memory_fraction: 0.02
  # Per shard: once a shard is over max_memory_bytes / shard_count times this,
  # writes to it that grow memory wait for cold to drain, then fail with OOM.
  # Under skew one shard can OOM while total hot memory is under the limit.
  backpressure_ratio: 1.25
  # A read miss fills hot only on the key's second miss in a window.
  fill_doorkeeper: true
  # A member read (SISMEMBER, HGET...) fills a collection only below this.
  fill_max_members: 1024
  # A fill larger than this share of a shard's budget is never made.
  fill_max_fraction: 0.0625
  # Keys held as loaded absent, a negative cache, across shards.
  negative_max_entries: 65536
  eviction_overrides:
    - prefix: "session:"
      eviction_seconds: 3600
    - prefix: "ephemeral:"
      eviction_seconds: 300

cold:
  backend: builtin_rocksdb
  data_path: /data/cold
  write_buffer_size_bytes: 67108864

  ttl_scanner:
    enabled: true
    base_sample_size: 20
    min_sample_size: 5
    max_sample_size: 200
    base_interval_ms: 1000
    min_interval_ms: 100
    max_interval_ms: 60000
    high_threshold: 0.25                       # ratio above this → ramp up
    low_threshold: 0.05                        # ratio below this → ramp down
    rate_increase_factor: 1.5
    rate_decrease_factor: 0.7
    disk_pressure_threshold: 0.9               # fs fraction at data_path
    disk_pressure_release_threshold: 0.855     # hysteresis on exit
    max_cpu_fraction: 0.10                     # scanner CPU cap (EWMA)
    cpu_ewma_window_seconds: 30

queue:
  backend: builtin_wal
  wal_path: /data/wal
  segment_size_bytes: 134217728
  # Largest single value accepted (default 64 MiB; up to 512 MiB). Must be at
  # least ~5 KiB below segment_size_bytes so one value fits a fixed-size segment.
  max_value_size_bytes: 67108864
  # Physical logs on the data volume, a power of two <= hot.shard_count.
  log_count: 1
  # Per-shard offset ring slots, a power of two in 4096..16777216.
  ring_entries: 65536
  min_retention_seconds: 86400
  # Committed-offset checkpoint cadence, 10..60000 ms. A crash replays at most
  # this much past the last checkpoint.
  offset_fsync_interval_ms: 1000
  # What an acknowledged write survives: process_crash or power_loss.
  durability: process_crash
  # Unflushed bytes across logs before appends wait, 1 MiB..4 GiB.
  durability_window_bytes: 67108864
  # Oldest unflushed entry's age per log before appends wait, 10..60000 ms.
  durability_window_ms: 1000

cold_consumer:
  quiet_threshold_seconds: 30
  safety_margin_seconds: 300
  jitter_fraction: 0.1
  buffer_high_water_bytes: 536870912
  buffer_low_water_bytes: 0             # 0 = auto, 3/4 of high_water
  max_flush_batch_size: 10000
  queue_read_max_count: 1024
  queue_read_timeout_ms: 50
  retry_initial_backoff_ms: 50
  retry_max_backoff_ms: 30000
  # Cold-store fsync cadence: at most one checkpoint per N applied batches or
  # per interval, whichever comes first. Lower = tighter durable frontier and
  # faster WAL retention release, at the cost of more fsyncs.
  checkpoint_max_flushes: 32
  checkpoint_min_interval_ms: 50
  # Capped exponential backoff for a drain/flush loop making no progress.
  loop_initial_backoff_ms: 1
  loop_max_backoff_ms: 1000
  # Per-shard budget for the graceful drain on SIGTERM. Keep below the K8s
  # terminationGracePeriodSeconds minus the /ready-flip propagation window.
  drain_grace_seconds: 15

recovery:
  # Workers the one recovery Scan replays shards on.
  replay_parallelism: 4

net:
  bind: 0.0.0.0
  port: 6379
  max_connections: 1024
  idle_timeout_seconds: 300
  io_threads: 0                       # 0 = auto: min(hardware_concurrency, 16)
  accept_queue: 128
  max_read_buffer_bytes: 67108864     # 64 MiB
  write_backpressure_bytes: 4194304   # 4 MiB — pause reading
  write_resume_bytes: 1048576         # 1 MiB — resume reading
  write_hard_limit_bytes: 16777216    # 16 MiB — close
  shutdown_grace_seconds: 30
  reaper_tick_ms: 1000

metrics:
  enabled: true
  bind: 0.0.0.0
  port: 9090
  snapshot_interval_ms: 1000        # Cadence for pushing snapshot-style gauges

admin:
  enabled: true
  bind: 0.0.0.0
  port: 8080

log:
  level: info               # trace | debug | info | warn | error | critical | off
  format: json              # json | text
  sink: stdout              # stdout | stderr
  component_levels:
    - component: queue.segment
      level: debug
