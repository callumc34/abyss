version: 2
updates:
  # Base images in docker/Dockerfile.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used across .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # vcpkg manifest. Bumps builtin-baseline in vcpkg.json, which is the single
  # pin behind RocksDB, prometheus-cpp, yaml-cpp, cpp-httplib, spdlog and gtest.
  - package-ecosystem: vcpkg
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
