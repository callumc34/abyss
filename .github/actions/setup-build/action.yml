name: Setup Abyss Build Environment
description: Install compiler and bootstrap vcpkg at the manifest baseline.

runs:
  using: composite
  steps:
    - name: Install compiler and tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq cmake gcc-14 g++-14 ninja-build
        echo "CC=/usr/bin/gcc-14" >> "${GITHUB_ENV}"
        echo "CXX=/usr/bin/g++-14" >> "${GITHUB_ENV}"

    - name: Bootstrap vcpkg
      shell: bash
      run: |
        BASELINE=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
        git init /opt/vcpkg
        git -C /opt/vcpkg remote add origin https://github.com/microsoft/vcpkg.git
        git -C /opt/vcpkg fetch --depth 1 origin "${BASELINE}"
        git -C /opt/vcpkg checkout FETCH_HEAD
        /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
        echo "VCPKG_ROOT=/opt/vcpkg" >> "${GITHUB_ENV}"
