name: Setup Abyss Build Environment
description: Install GCC 14, Ninja, vcpkg (pinned to vcpkg.json baseline), and configure binary caching

runs:
  using: composite
  steps:
    - name: Install compiler and tools
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq cmake gcc-14 g++-14 ninja-build
        echo "CC=/usr/bin/gcc-14" >> "${GITHUB_ENV}"
        echo "CXX=/usr/bin/g++-14" >> "${GITHUB_ENV}"

    - name: Read vcpkg baseline
      id: vcpkg-baseline
      shell: bash
      run: |
        BASELINE=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['builtin-baseline'])")
        echo "commit=${BASELINE}" >> "${GITHUB_OUTPUT}"

    - name: Create binary cache directory
      shell: bash
      run: mkdir -p /home/runner/.cache/vcpkg/archives

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: /home/runner/.cache/vcpkg/archives
        key: vcpkg-${{ runner.os }}-${{ steps.vcpkg-baseline.outputs.commit }}-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ steps.vcpkg-baseline.outputs.commit }}-
          vcpkg-${{ runner.os }}-

    - name: Bootstrap vcpkg
      shell: bash
      run: |
        git init /opt/vcpkg
        git -C /opt/vcpkg remote add origin https://github.com/microsoft/vcpkg.git
        git -C /opt/vcpkg fetch --depth 1 origin "${{ steps.vcpkg-baseline.outputs.commit }}"
        git -C /opt/vcpkg checkout FETCH_HEAD
        /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
        echo "VCPKG_ROOT=/opt/vcpkg" >> "${GITHUB_ENV}"
        echo "VCPKG_DEFAULT_BINARY_CACHE=/home/runner/.cache/vcpkg/archives" >> "${GITHUB_ENV}"
