name: Setup Abyss Build Environment (Windows)
description: Activate the MSVC dev environment, bootstrap vcpkg at the manifest baseline, and wire the GitHub Packages NuGet feed as the vcpkg binary cache.

inputs:
  github_token:
    description: GITHUB_TOKEN with packages:write to authenticate with the NuGet feed.
    required: true
  github_owner:
    description: Repository owner whose GitHub Packages NuGet feed hosts the vcpkg binary cache.
    required: true

runs:
  using: composite
  steps:
    - name: Activate MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Bootstrap vcpkg
      shell: pwsh
      run: |
        $baseline = (Get-Content -Raw vcpkg.json | ConvertFrom-Json).'builtin-baseline'
        $vcpkgDir = "$env:RUNNER_WORKSPACE\vcpkg"
        git init $vcpkgDir | Out-Null
        git -C $vcpkgDir remote add origin https://github.com/microsoft/vcpkg.git
        git -C $vcpkgDir fetch --depth 1 origin $baseline
        git -C $vcpkgDir checkout FETCH_HEAD
        & "$vcpkgDir\bootstrap-vcpkg.bat" -disableMetrics
        "VCPKG_ROOT=$vcpkgDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Configure GitHub Packages NuGet feed
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_OWNER: ${{ inputs.github_owner }}
      run: |
        $nuget = (& "$env:VCPKG_ROOT\vcpkg.exe" fetch nuget) | Select-Object -Last 1
        $feed = "https://nuget.pkg.github.com/$env:GITHUB_OWNER/index.json"
        & $nuget sources add `
          -Source $feed `
          -StorePasswordInClearText `
          -Name GitHub `
          -Username $env:GITHUB_OWNER `
          -Password $env:GITHUB_TOKEN
        & $nuget setapikey $env:GITHUB_TOKEN -Source $feed
