name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'src/**'
              - 'apps/**'
              - 'include/**'
              - 'tests/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'CMakeUserPresets.json'
              - 'vcpkg.json'
              - 'docker/**'
              - '.clang-format'
              - '.clang-tidy'
              - '.dockerignore'
            ci:
              - '.github/**'

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_format.yml

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_build.yml
    secrets: inherit

  build-windows:
    name: Build (Windows)
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_build-windows.yml
    secrets: inherit

  sanitizer:
    name: Sanitizer
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    uses: ./.github/workflows/_sanitizer.yml
    with:
      preset: ${{ matrix.preset }}
    secrets: inherit

  docker:
    name: Docker
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_docker.yml
    secrets: inherit

  ci:
    name: CI
    runs-on: ubuntu-24.04
    needs: [changes, format, build, build-windows, sanitizer, docker]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Aggregate result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEEDS_JSON}" | jq .
          printf '%s\n' "${NEEDS_JSON}" | \
            jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            > /dev/null
