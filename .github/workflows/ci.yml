name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every main commit runs to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    if: github.event.pull_request.draft != true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'src/**'
              - 'apps/**'
              - 'include/**'
              - 'tests/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'CMakeUserPresets.json'
              - 'vcpkg.json'
              - 'docker/**'
              - '.clang-format'
              - '.clang-tidy'
              - '.dockerignore'
            ci:
              - '.github/**'

  format:
    name: Format
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_format.yml

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    uses: ./.github/workflows/_build.yml
    secrets: inherit

  # Windows and macOS builds are not part of this gate: they bill at 2x and 10x
  # Linux minutes. Run _build-windows.yml / _build-macos.yml via
  # workflow_dispatch when platform code changes.

  sanitizer:
    name: Sanitizer
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan, ubsan]
    uses: ./.github/workflows/_sanitizer.yml
    with:
      preset: ${{ matrix.preset }}
    secrets: inherit

  docker:
    name: Docker
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.ci == 'true'
    # A called workflow can only narrow the caller's token, never widen it, so
    # the signing and attestation scopes must be granted here or _docker.yml
    # fails validation before it runs.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_docker.yml
    secrets: inherit

  ci:
    name: CI
    runs-on: ubuntu-24.04
    needs: [changes, format, build, sanitizer, docker]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Aggregate result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEEDS_JSON}" | jq .
          printf '%s\n' "${NEEDS_JSON}" | \
            jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            > /dev/null
