name: Sanitizer

on:
  workflow_call:
    inputs:
      preset:
        description: CMake preset to configure (e.g. asan, tsan, ubsan).
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"

jobs:
  sanitizer:
    name: Sanitizer (${{ inputs.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_owner: ${{ github.repository_owner }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ inputs.preset }}
          max-size: 500M

      - name: Configure
        run: cmake --preset ${{ inputs.preset }} -G Ninja -DABYSS_WERROR=ON

      - name: Build
        run: cmake --build build/${{ inputs.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ inputs.preset }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:suppressions=${{ github.workspace }}/cmake/tsan_suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:abort_on_error=1:suppressions=${{ github.workspace }}/cmake/ubsan_suppressions.txt
