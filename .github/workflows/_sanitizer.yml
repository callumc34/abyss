name: Sanitizer

on:
  workflow_call:
    inputs:
      preset:
        description: CMake preset to configure (e.g. asan, tsan, ubsan).
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"

jobs:
  sanitizer:
    name: Sanitizer (${{ inputs.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_owner: ${{ github.repository_owner }}

      - name: Install Clang for UBSan
        if: inputs.preset == 'ubsan'
        run: |
          sudo apt-get install -y -qq clang-19 llvm-19 libstdc++-14-dev
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-19   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-19 100

          # Force clang at gcc-14's libstdc++.
          STDCXX="-isystem/usr/include/c++/14 -isystem/usr/include/x86_64-linux-gnu/c++/14 -isystem/usr/include/c++/14/backward"
          GCC_DIR="--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14"
          echo "CC=clang"   >> "${GITHUB_ENV}"
          echo "CXX=clang++" >> "${GITHUB_ENV}"
          echo "CFLAGS=${GCC_DIR}"   >> "${GITHUB_ENV}"
          echo "CXXFLAGS=${STDCXX} ${GCC_DIR}" >> "${GITHUB_ENV}"
          echo "LDFLAGS=${GCC_DIR}" >> "${GITHUB_ENV}"
          echo "UBSAN_SYMBOLIZER_PATH=/usr/bin/llvm-symbolizer-19" >> "${GITHUB_ENV}"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ inputs.preset }}
          max-size: 500M

      - name: Configure
        run: cmake --preset ${{ inputs.preset }} -G Ninja -DABYSS_WERROR=ON

      - name: Build
        run: cmake --build build/${{ inputs.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ inputs.preset }}
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:suppressions=${{ github.workspace }}/cmake/tsan_suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:abort_on_error=1:suppressions=${{ github.workspace }}/cmake/ubsan_suppressions.txt
