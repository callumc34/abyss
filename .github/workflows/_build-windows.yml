name: Build & Test (Windows)

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"

jobs:
  build-test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build-windows
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_owner: ${{ github.repository_owner }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Probe sccache
        id: sccache_probe
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          sccache --start-server
          if ($LASTEXITCODE -eq 0) {
            "ABYSS_USE_CCACHE=ON" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Warning "sccache failed to start; building without compile cache"
            "ABYSS_USE_CCACHE=OFF" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          exit 0

      - name: Configure
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: cmake --preset windows -G Ninja "-DABYSS_USE_CCACHE=$env:ABYSS_USE_CCACHE"

      - name: Build
        shell: pwsh
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          cmake --build build/windows --parallel
          if ($env:ABYSS_USE_CCACHE -eq "ON") { sccache --show-stats }

      - name: Test
        shell: pwsh
        run: ctest --preset windows --output-on-failure
