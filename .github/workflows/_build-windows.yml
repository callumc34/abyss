name: Build & Test (Windows)

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"

jobs:
  build-test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6

      - name: Set up build environment
        uses: ./.github/actions/setup-build-windows
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_owner: ${{ github.repository_owner }}

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-default -G Ninja

      - name: Build
        shell: pwsh
        run: cmake --build build/windows-default --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset windows-default --output-on-failure
