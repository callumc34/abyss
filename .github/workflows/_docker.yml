name: Docker

on:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract vcpkg baseline
        id: vcpkg
        run: |
          BASELINE=$(jq -er '."builtin-baseline"' vcpkg.json)
          echo "baseline=${BASELINE}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CI_REQUIRE_BINARY_CACHE=1
            VCPKG_BASELINE=${{ steps.vcpkg.outputs.baseline }}
            NUGET_FEED_OWNER=${{ github.repository_owner }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,ignore-error=true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
