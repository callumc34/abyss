name: Docker

on:
  workflow_call:

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # id-token/attestations cannot be elevated by a called workflow: the calling
    # job in ci.yml must grant them too, otherwise the run is rejected.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      # Only default-branch pushes publish (push, sign, attest); PRs build to
      # validate. Published versions count against Packages storage, and
      # keyless signing must not let a Sigstore outage fail every PR.
      ABYSS_PUBLISH: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.ABYSS_PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract vcpkg baseline
        id: vcpkg
        run: |
          BASELINE=$(jq -er '."builtin-baseline"' vcpkg.json)
          echo "baseline=${BASELINE}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ env.ABYSS_PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit-generated SLSA provenance and SPDX SBOM, attached to the
          # pushed image as in-toto attestations.
          provenance: ${{ env.ABYSS_PUBLISH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.ABYSS_PUBLISH }}
          build-args: |
            CI_REQUIRE_BINARY_CACHE=1
            VCPKG_BASELINE=${{ steps.vcpkg.outputs.baseline }}
            NUGET_FEED_OWNER=${{ github.repository_owner }}
          # Actions cache, not a GHCR tag: every overwrite of a registry cache
          # tag leaves an untagged version that is billed as Packages storage.
          cache-from: type=gha,scope=abyss-image
          cache-to: type=gha,scope=abyss-image,mode=max,ignore-error=true
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: env.ABYSS_PUBLISH == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest
        if: env.ABYSS_PUBLISH == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        # Non-blocking: the image already carries BuildKit provenance and is
        # signed, so a transient Sigstore/attestation-API failure here must not
        # fail an otherwise good default-branch build.
        if: env.ABYSS_PUBLISH == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
