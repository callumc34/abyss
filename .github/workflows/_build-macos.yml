name: Build & Test (macOS)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHub,readwrite"

jobs:
  build-test-macos:
    name: Build & Test (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      # Pinned rather than the image default so a runner-image update cannot
      # silently move the toolchain; matches the verified local toolchain.
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-build-macos
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_owner: ${{ github.repository_owner }}

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: macos
          max-size: 500M

      - name: Configure
        run: cmake --preset macos -G Ninja

      - name: Build
        run: cmake --build build/macos --parallel

      - name: Test
        run: ctest --preset macos
