# run_server_ab.sh writes this to <run-dir>/srv-pl.yaml, with the AB_* words replaced.
profile: embedded
cold:
  backend: builtin_rocksdb
  data_path: AB_DATA_DIR/cold
queue:
  backend: builtin_wal
  wal_path: AB_DATA_DIR/wal
  durability: power_loss
cold_consumer:
  quiet_threshold_seconds: 5
net:
  bind: 127.0.0.1
  port: AB_RESP_PORT
metrics:
  enabled: true
  bind: 127.0.0.1
  port: AB_METRICS_PORT
admin:
  enabled: true
  bind: 127.0.0.1
  port: AB_ADMIN_PORT
log:
  level: info
  format: text
  sink: stderr
