# Reference workload for authoritative runs on perf-grade hardware.
# Open-loop at the 100K ops/s durable write throughput target, with
# up to 320 requests in flight (80 connections x pipeline depth 4). The
# target holds only if SET p99 also stays within the write probe's
# durable bound on the same volume; loadgen --sweep finds the highest
# such rate.
# See docs/development/performance.md §Conditions of measurement.
name: write-throughput
description: 100% SET, uniform, open-loop at 100K ops/s across 80 connections at depth 4.
duration_seconds: 60
warmup_seconds: 10
workers: 8
connections_per_worker: 10
pipeline_depth: 4
target_rate_ops: 100000
key_count: 1000000
key_distribution:
  kind: uniform
  seed: 1
value_size_bytes: 64
mix:
  SET: 1.0
preload:
  enabled: false
targets:
  throughput_ops: 100000
