<?xml version="1.0" encoding="UTF-8"?>
<!--
  GitHub social preview, 1280 × 640. Upload the rendered PNG via
  Settings → Social preview on github.com/callumc34/abyss.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img"
     aria-label="Abyss — a Redis-compatible KV store with transparent hot-cold tiering.">
  <defs>
    <linearGradient id="bgDepth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1A1320"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="markDepth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A855F7"/>
      <stop offset="55%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bgDepth)"/>
  <ellipse cx="200" cy="540" rx="520" ry="260" fill="url(#glow)"/>
  <ellipse cx="1080" cy="120" rx="420" ry="220" fill="url(#glow)"/>

  <!-- Subtle scanline grid -->
  <g stroke="#241830" stroke-width="1" opacity="0.5">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
  </g>

  <!-- Mark -->
  <g transform="translate(120,200)">
    <rect x="0" y="0" width="220" height="220" rx="36" fill="#7C3AED"/>
    <polygon points="36,42 184,42 110,206" fill="url(#markDepth)"/>
    <line x1="36" y1="42" x2="184" y2="42" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="system-ui, -apple-system, Inter, 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
    <text x="400" y="320" font-size="140" font-weight="800" letter-spacing="-4">abyss</text>
    <text x="402" y="384" font-size="32" font-weight="400" fill="#E9D5FF" letter-spacing="-0.5">
      A Redis-compatible KV store with transparent hot–cold tiering.
    </text>
  </g>

  <!-- Footer mark -->
  <g font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', monospace" fill="#8B5CF6">
    <text x="120" y="590" font-size="22" font-weight="500" letter-spacing="2">
      C++23 · Kappa architecture · Kubernetes-native
    </text>
  </g>
</svg>
