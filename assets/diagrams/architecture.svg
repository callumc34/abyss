<?xml version="1.0" encoding="UTF-8"?>
<!--
  README-facing architecture diagram. The authoritative ASCII version lives
  in docs/design/architecture.md; this one is a rendered convenience.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img"
     aria-label="Abyss architecture: clients connect via the RESP frontend, writes land on the append-only queue, two consumers materialise hot and cold tiers.">
  <defs>
    <linearGradient id="purpleNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="depthNode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#1A1320"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7C3AED"/>
    </marker>
  </defs>

  <style>
    .box   { fill: url(#purpleNode); stroke: #C4B5FD; stroke-width: 1.5; }
    .well  { fill: url(#depthNode);  stroke: #C4B5FD; stroke-width: 1.5; }
    .lbl   { font-family: system-ui, -apple-system, Inter, 'Helvetica Neue', sans-serif;
             font-size: 22px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
    .sub   { font-family: ui-monospace, 'JetBrains Mono', 'Fira Code', monospace;
             font-size: 14px; fill: #E9D5FF; text-anchor: middle; }
    .edge  { stroke: #7C3AED; stroke-width: 2.5; fill: none; }
    .note  { font-family: system-ui, -apple-system, Inter, 'Helvetica Neue', sans-serif;
             font-size: 13px; fill: #A78BFA; text-anchor: start; font-style: italic; }
  </style>

  <!-- Client -->
  <rect class="box" x="475" y="40" width="250" height="70" rx="10"/>
  <text class="lbl" x="600" y="72">Redis client</text>
  <text class="sub" x="600" y="95">any RESP2 library</text>

  <line class="edge" x1="600" y1="110" x2="600" y2="160" marker-end="url(#arrow)"/>

  <!-- RESP frontend -->
  <rect class="box" x="450" y="160" width="300" height="70" rx="10"/>
  <text class="lbl" x="600" y="192">RESP frontend</text>
  <text class="sub" x="600" y="215">protocol &amp; dispatch</text>

  <line class="edge" x1="600" y1="230" x2="600" y2="280" marker-end="url(#arrow)"/>

  <!-- Queue (the well) -->
  <rect class="well" x="425" y="280" width="350" height="130" rx="14"/>
  <text class="lbl" x="600" y="318">Queue (WAL)</text>
  <text class="sub" x="600" y="345">append-only · single source of truth</text>
  <text class="sub" x="600" y="370">durable before ack</text>
  <text class="note" x="445" y="395">writes ack here</text>

  <!-- Fan-out edges -->
  <path class="edge" d="M 500 410 Q 350 460 300 510" marker-end="url(#arrow)"/>
  <path class="edge" d="M 700 410 Q 850 460 900 510" marker-end="url(#arrow)"/>

  <!-- Hot consumer -->
  <rect class="box" x="170" y="510" width="260" height="70" rx="10"/>
  <text class="lbl" x="300" y="542">Hot consumer</text>
  <text class="sub" x="300" y="565">eager · real-time</text>

  <line class="edge" x1="300" y1="580" x2="300" y2="630" marker-end="url(#arrow)"/>

  <rect class="box" x="170" y="630" width="260" height="60" rx="10"/>
  <text class="lbl" x="300" y="668">Hot store · in-memory</text>

  <!-- Cold consumer -->
  <rect class="box" x="770" y="510" width="260" height="70" rx="10"/>
  <text class="lbl" x="900" y="542">Cold consumer</text>
  <text class="sub" x="900" y="565">compacting · lagging</text>

  <line class="edge" x1="900" y1="580" x2="900" y2="630" marker-end="url(#arrow)"/>

  <rect class="box" x="770" y="630" width="260" height="60" rx="10"/>
  <text class="lbl" x="900" y="668">Cold store · on-disk</text>

  <!-- Note -->
  <text class="note" x="60" y="710">consumers are independent — neither blocks the other</text>
</svg>
